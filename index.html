  <script>if(/[?&]safe=1/.test(location.search))document.documentElement.classList.add("sl-safe")</script>
  <link rel="stylesheet" href="css/app.css?v=43">
  <script>
    // ?debug=1 → แสดง error/สถานะบนจอ (ใช้ตรวจปัญหาบนมือถือจริง)
    (function () {
      if (!/[?&]debug=1/.test(location.search)) return;
      var log = [];
      function out() {
        var el = document.getElementById('sl-debug');
        if (!el) { el = document.createElement('pre'); el.id = 'sl-debug'; el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:45vh;overflow:auto;margin:0;padding:10px;border-radius:12px;background:rgba(0,0,0,.85);color:#7CFC9A;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap'; document.body.appendChild(el); }
        var app = document.getElementById('app');
        var card = document.querySelector('#app .card'), r = card && card.getBoundingClientRect(), cs = card && getComputedStyle(card);
        el.textContent = 'UA: ' + navigator.userAgent + '\n' +
          'app children: ' + (app ? app.children.length : '-') + ' · auth: ' + !!document.querySelector('.auth') + ' · card: ' + !!card +
          (card ? ' · rect ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' · opacity ' + cs.opacity + ' · vis ' + cs.visibility : '') +
          ' · vw ' + innerWidth + 'x' + innerHeight + '\n' +
          'build css=' + getComputedStyle(document.documentElement).getPropertyValue('--build').trim() + ' js=' + (window.SL_BUILD || '-') + ' · safe=' + document.documentElement.classList.contains('sl-safe') + '\n' +
          '#app pos=' + (app ? getComputedStyle(app).position + ' z=' + getComputedStyle(app).zIndex + ' h=' + app.offsetHeight : '-') + '\n' +
          'top@card: ' + (card ? hit(r.left + r.width / 2, r.top + 80) : '-') + '\n' +
          'chain: ' + (card ? chain(card) : '-') + '\n' + log.join('\n');
      }
      function desc(el) { if (!el) return 'null'; return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : ''); }
      function hit(x, y) { return desc(document.elementFromPoint(x, y)); }
      function chain(el) { var out = []; for (var e = el; e && e !== document.documentElement; e = e.parentElement) { var c = getComputedStyle(e); var f = []; if (c.position !== 'static') f.push(c.position); if (c.zIndex !== 'auto') f.push('z' + c.zIndex); if (c.transform !== 'none') f.push('tf'); if (c.overflow !== 'visible') f.push('ov:' + c.overflow); if (c.opacity !== '1') f.push('op' + c.opacity); if (c.filter !== 'none') f.push('flt'); if ((c.webkitBackdropFilter || c.backdropFilter || 'none') !== 'none') f.push('bdf'); if (c.willChange !== 'auto') f.push('wc'); out.push(desc(e).split('.')[0] + (f.length ? '[' + f.join(',') + ']' : '')); } return out.join(' < '); }
      window.addEventListener('error', function (e) { log.push('ERR ' + (e.message || e.type) + ' @ ' + (e.filename || (e.target && (e.target.src || e.target.href)) || '') + ':' + (e.lineno || '')); out(); }, true);
      window.addEventListener('unhandledrejection', function (e) { log.push('REJ ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); out(); });
      setInterval(out, 1500);
    })();
  </script>
  <script>try{var t=localStorage.getItem("slTheme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
    // ตาข่ายกันจอว่าง: JS โหลดไม่ขึ้น/เบราว์เซอร์เก่า → แสดงข้อความ + ปุ่มลองใหม่ แทนหน้าขาว
    (function () {
      function fail(why) {
        var a = document.getElementById('app');
        if (!a || document.querySelector('#app .card, #app .app')) return;   // มีการ์ด login หรือหน้าหลักแล้ว = ปกติ
        a.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,system-ui,sans-serif">' +
          '<div><div style="font-size:28px;font-weight:700;margin-bottom:8px">Sup Live</div>' +
          '<p style="color:#6e6e73;margin:0 0 18px;line-height:1.6">โหลดหน้าเว็บไม่สำเร็จ<br>ลองใหม่อีกครั้ง หรือเปิดด้วย Safari / Chrome เวอร์ชันล่าสุด</p>' +
          '<button onclick="location.reload()" style="border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:600;color:#fff;background:#0071e3">ลองใหม่</button>' +
          '<p style="color:#86868b;font-size:12px;margin-top:16px">' + (why || '') + '</p></div></div>';
      }
      window.addEventListener('error', function (e) { setTimeout(function () { fail(e && e.message ? String(e.message).slice(0, 120) : ''); }, 300); });
      setTimeout(function () { fail('timeout'); }, 9000);
    })();
  </script>
  <script nomodule>document.getElementById('app').innerHTML = '<p style="padding:40px;text-align:center;font-family:sans-serif">เบราว์เซอร์นี้เก่าเกินไป กรุณาอัปเดต Safari / Chrome</p>';</script>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Sup Live ต้องเปิด JavaScript</noscript>
  <script type="module" src="js/app.js?v=43"></script>
</body>
</html>
